name: Arena
on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/arena.svg?palette=github-dark&color_snake=#ff2a33&color_dots=#161b22,#4a0b0f,#7a1116,#b3141b,#ff2a33
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
